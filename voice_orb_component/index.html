<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        color-scheme: normal;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --midnight: #05070d;
        --cobalt: #3568ff;
        --lime: #c7f000;
        --muted: #a6b0c9;
      }

      * { box-sizing: border-box; }

      html, body, .stage { background: transparent !important; }

      body {
        margin: 0;
        min-height: 235px;
        color: #eef2ff;
      }

      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 235px;
        padding: 4px 12px 10px;
        text-align: center;
      }

      .orb-button {
        position: relative;
        display: grid;
        width: clamp(150px, 29vw, 205px);
        aspect-ratio: 1;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .orb-button:focus-visible {
        outline: 3px solid var(--lime);
        outline-offset: 9px;
      }

      .orb {
        --voice-scale: 1;
        --voice-glow: 0.6;
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid #c7f000b0;
        border-radius: 50%;
        background:
          radial-gradient(ellipse at 30% 55%, #3c78ff 0%, #2455dc77 19%, transparent 43%),
          radial-gradient(ellipse at 68% 42%, #c7f000 0%, #9dbd0070 15%, transparent 39%),
          radial-gradient(ellipse at 49% 62%, #0b1325 0%, #05070d 64%, #03050a 100%);
        box-shadow:
          0 0 calc(12px + 24px * var(--voice-glow)) #3568ff99,
          0 0 calc(20px + 34px * var(--voice-glow)) #c7f00055,
          inset 10px 0 22px #3568ff77,
          inset -12px 0 28px #c7f00055,
          inset 0 8px 18px #a5baff55,
          inset 0 -12px 26px #1744b877;
        transform: scale(var(--voice-scale));
        transition: transform 110ms ease-out, box-shadow 110ms ease-out;
        animation: orb-float 4s ease-in-out infinite;
      }

      .orb::before {
        position: absolute;
        inset: -18%;
        border-radius: 50%;
        background: conic-gradient(
          from var(--light-angle, 210deg),
          transparent 0deg,
          #3568ff99 76deg,
          transparent 125deg,
          #c7f000bb 214deg,
          #3568ffbb 264deg,
          transparent 315deg
        );
        content: "";
        filter: blur(20px);
        opacity: .78;
        mix-blend-mode: screen;
        animation: light-drift 9s linear infinite;
      }

      .orb::after {
        position: absolute;
        inset: 3px;
        border: 1px solid #eaff4f3d;
        border-radius: inherit;
        background: radial-gradient(ellipse at 38% 25%, #ffffff12, transparent 42%);
        box-shadow: inset 0 0 35px #020617aa;
        content: "";
      }

      .orb-button.is-recording .orb {
        animation: none;
        box-shadow:
          0 0 22px #c7f000dd,
          0 0 62px #3568ffbb,
          inset 10px 0 28px #3568ff99,
          inset -12px 0 30px #c7f00088,
          inset 0 0 42px #193c9caa;
      }

      .orb-button.is-recording .orb::before {
        opacity: .96;
      }

      @keyframes orb-float {
        0%, 100% { transform: scale(var(--voice-scale)) translateY(0); }
        50% { transform: scale(var(--voice-scale)) translateY(-4px); }
      }

      @keyframes light-drift {
        from { transform: rotate(0deg) scale(1.02); }
        to { transform: rotate(360deg) scale(1.02); }
      }

      .status {
        min-height: 28px;
        margin-top: 6px;
        color: #f0f3ff;
        font-size: 1rem;
        font-weight: 650;
      }

      .hint {
        max-width: 440px;
        min-height: 22px;
        margin: 2px 0 0;
        color: var(--muted);
        font-size: .88rem;
        line-height: 1.5;
      }

      .timer {
        min-height: 20px;
        margin-top: 6px;
        color: #d7f63c;
        font-variant-numeric: tabular-nums;
        font-size: .84rem;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <button class="orb-button" id="orb-button" type="button" aria-label="Start recording">
        <span class="orb" id="orb" aria-hidden="true"></span>
      </button>
      <div class="status" id="status" role="status" aria-live="polite">Ready to listen</div>
      <p class="hint" id="hint">Tap the orb to speak. Tap it again to stop recording.</p>
      <div class="timer" id="timer" aria-live="off"></div>
      <div class="sr-only" id="error" role="alert"></div>
    </main>
    <script>
      const orbButton = document.getElementById("orb-button");
      const orb = document.getElementById("orb");
      const statusText = document.getElementById("status");
      const hintText = document.getElementById("hint");
      const timerText = document.getElementById("timer");
      const errorText = document.getElementById("error");

      let maxSeconds = 15;
      let context = null;
      let stream = null;
      let source = null;
      let analyser = null;
      let processor = null;
      let mutedOutput = null;
      let chunks = [];
      let startedAt = 0;
      let animationFrame = 0;
      let timerHandle = 0;
      let recording = false;
      let locked = false;
      let eventCounter = 0;
      const streamlitUrl = new URLSearchParams(window.location.search).get("streamlitUrl");
      const parentOrigin = streamlitUrl ? new URL(streamlitUrl).origin : window.location.origin;

      function sendMessage(type, data) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type }, data || {}),
          parentOrigin
        );
      }

      function setFrameHeight() {
        sendMessage("streamlit:setFrameHeight", { height: 310 });
      }

      function showStatus(text, hint) {
        statusText.textContent = text;
        hintText.textContent = hint;
      }

      function resetOrb() {
        orb.style.setProperty("--voice-scale", "1");
        orb.style.setProperty("--voice-glow", "0.6");
        orb.style.setProperty("--light-angle", "210deg");
      }

      function animateVoice() {
        if (!recording || !analyser) return;
        const samples = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(samples);
        let energy = 0;
        for (const sample of samples) {
          const normalized = (sample - 128) / 128;
          energy += normalized * normalized;
        }
        const rms = Math.sqrt(energy / samples.length);
        const level = Math.min(1, rms * 7);
        orb.style.setProperty("--voice-scale", (1 + level * 0.13).toFixed(3));
        orb.style.setProperty("--voice-glow", (0.25 + level).toFixed(3));
        orb.style.setProperty("--light-angle", `${210 + level * 95}deg`);
        animationFrame = requestAnimationFrame(animateVoice);
      }

      function resample(samples, inputRate, outputRate) {
        if (inputRate === outputRate) return samples;
        const outputLength = Math.floor(samples.length * outputRate / inputRate);
        const output = new Float32Array(outputLength);
        const ratio = inputRate / outputRate;
        for (let index = 0; index < outputLength; index += 1) {
          const position = index * ratio;
          const left = Math.floor(position);
          const fraction = position - left;
          const right = Math.min(left + 1, samples.length - 1);
          output[index] = samples[left] * (1 - fraction) + samples[right] * fraction;
        }
        return output;
      }

      function encodeWav(samples, sampleRate) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        const writeText = (offset, text) => {
          for (let index = 0; index < text.length; index += 1) {
            view.setUint8(offset + index, text.charCodeAt(index));
          }
        };
        writeText(0, "RIFF");
        view.setUint32(4, 36 + samples.length * 2, true);
        writeText(8, "WAVE");
        writeText(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeText(36, "data");
        view.setUint32(40, samples.length * 2, true);
        for (let index = 0; index < samples.length; index += 1) {
          const clipped = Math.max(-1, Math.min(1, samples[index]));
          view.setInt16(44 + index * 2, clipped < 0 ? clipped * 32768 : clipped * 32767, true);
        }
        return new Uint8Array(buffer);
      }

      function toBase64(bytes) {
        let binary = "";
        const sliceSize = 0x8000;
        for (let offset = 0; offset < bytes.length; offset += sliceSize) {
          const slice = bytes.subarray(offset, Math.min(offset + sliceSize, bytes.length));
          binary += String.fromCharCode(...slice);
        }
        return btoa(binary);
      }

      function cleanup() {
        recording = false;
        locked = false;
        cancelAnimationFrame(animationFrame);
        clearInterval(timerHandle);
        if (processor) processor.disconnect();
        if (source) source.disconnect();
        if (analyser) analyser.disconnect();
        if (mutedOutput) mutedOutput.disconnect();
        if (stream) stream.getTracks().forEach((track) => track.stop());
        if (context && context.state !== "closed") context.close();
        processor = null;
        source = null;
        analyser = null;
        mutedOutput = null;
        stream = null;
        context = null;
        orbButton.classList.remove("is-recording");
        orbButton.setAttribute("aria-label", "Start recording");
        resetOrb();
      }

      function emitRecording(samples, rate, duration) {
        const wav = encodeWav(resample(samples, rate, 16000), 16000);
        sendMessage("streamlit:setComponentValue", {
          value: {
            event_id: `${Date.now()}-${++eventCounter}`,
            audio_base64: toBase64(wav),
            duration_seconds: duration,
            sample_rate: 16000,
            mime_type: "audio/wav"
          }
        });
      }

      function stopRecording() {
        if (!recording) return;
        const duration = Math.min(maxSeconds, (Date.now() - startedAt) / 1000);
        const allSamples = new Float32Array(chunks.reduce((count, chunk) => count + chunk.length, 0));
        let offset = 0;
        for (const chunk of chunks) {
          allSamples.set(chunk, offset);
          offset += chunk.length;
        }
        const inputRate = context ? context.sampleRate : 16000;
        cleanup();
        chunks = [];
        timerText.textContent = "";
        locked = true;
        if (allSamples.length === 0 || duration < 0.1) {
          locked = false;
          showStatus("Recording too short", "Tap the orb and speak for at least a moment, then tap to stop.");
          sendMessage("streamlit:setComponentValue", {
            value: { event_id: `${Date.now()}-${++eventCounter}`, error: "The recording was too short." }
          });
          return;
        }
        showStatus("Recording ready", "Listen to your recording below, then choose whether to process it.");
        emitRecording(allSamples, inputRate, duration);
        locked = false;
        orbButton.setAttribute("aria-label", "Start a new recording");
      }

      async function startRecording() {
        if (recording || locked) return;
        locked = true;
        errorText.textContent = "";
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("Microphone recording is not supported by this browser.");
          }
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
            video: false
          });
          context = new (window.AudioContext || window.webkitAudioContext)();
          await context.resume();
          source = context.createMediaStreamSource(stream);
          analyser = context.createAnalyser();
          analyser.fftSize = 512;
          processor = context.createScriptProcessor(4096, 1, 1);
          mutedOutput = context.createGain();
          mutedOutput.gain.value = 0;
          processor.onaudioprocess = (event) => {
            if (recording) chunks.push(new Float32Array(event.inputBuffer.getChannelData(0)));
          };
          source.connect(analyser);
          source.connect(processor);
          processor.connect(mutedOutput);
          mutedOutput.connect(context.destination);
          chunks = [];
          startedAt = Date.now();
          recording = true;
          locked = false;
          orbButton.classList.add("is-recording");
          orbButton.setAttribute("aria-label", "Stop recording");
          showStatus("Listening…", "Speak your number. Tap the glowing orb again to stop.");
          sendMessage("streamlit:setComponentValue", {
            value: { event_id: `${Date.now()}-${++eventCounter}`, state: "recording" }
          });
          animateVoice();
          timerHandle = window.setInterval(() => {
            const seconds = (Date.now() - startedAt) / 1000;
            timerText.textContent = `${Math.min(seconds, maxSeconds).toFixed(1)} / ${maxSeconds} sec`;
            if (seconds >= maxSeconds) stopRecording();
          }, 100);
        } catch (error) {
          cleanup();
          errorText.textContent = error.message || "Could not access the microphone.";
          showStatus("Microphone unavailable", errorText.textContent);
        }
      }

      orbButton.addEventListener("click", () => {
        if (recording) stopRecording();
        else startRecording();
      });
      window.addEventListener("pagehide", cleanup);

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent || event.origin !== parentOrigin) return;
        const message = event.data;
        if (!message || typeof message !== "object") return;
        if (message.type === "streamlit:render") {
          const nextMax = Number(message.args && message.args.max_seconds);
          if (Number.isFinite(nextMax) && nextMax >= 1) maxSeconds = Math.min(15, nextMax);
        }
      });

      sendMessage("streamlit:componentReady", { apiVersion: 1 });
      setFrameHeight();
    </script>
  </body>
</html>
